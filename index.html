<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Escanea el QR para subir tus fotos</title>
  <style>
    :root {
      --bg: #faf7f2;
      --card: #ffffff;
      --text: #24211e;
      --muted: #6e665f;
      --accent: #8c6239;
      --accent-hover: #734f2d;
      --border: #dfd6c9;
      --success-bg: #edf7ed;
      --success-text: #1e5620;
      --error-bg: #fdecea;
      --error-text: #8a1c1c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    h1 {
      text-align: center;
      font-size: clamp(1.5rem, 4.5vw, 2rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    .qr-box {
      background: var(--card);
      border: 3px solid var(--text);
      border-radius: 16px;
      padding: 1.4rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      box-shadow: 0 8px 24px rgba(36, 33, 30, 0.06);
    }

    .qr-frame {
      width: 210px;
      height: 210px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.6rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .qr-frame img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .upload-area {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .pick-btn {
      width: 100%;
      padding: 0.9rem 1rem;
      border: 2px dashed var(--accent);
      border-radius: 12px;
      background: #fdfbf8;
      color: var(--accent);
      font-weight: 700;
      font-size: 1rem;
      text-align: center;
      cursor: pointer;
      transition: background 0.2s;
    }

    .pick-btn:hover {
      background: #faf3e8;
    }

    .pick-sub {
      display: block;
      font-size: 0.82rem;
      font-weight: 400;
      color: var(--muted);
      margin-top: 0.15rem;
    }

    input[type="file"] {
      display: none;
    }

    .previews {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(68px, 1fr));
      gap: 0.5rem;
    }

    .previews img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 9px;
      border: 1px solid var(--border);
    }

    .btn-send {
      width: 100%;
      padding: 0.95rem 1rem;
      border: none;
      border-radius: 12px;
      background: var(--accent);
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
    }

    .btn-send:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    .btn-send:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status-msg {
      padding: 0.8rem 0.95rem;
      border-radius: 10px;
      font-size: 0.92rem;
      text-align: center;
      display: none;
    }

    .status-msg.show {
      display: block;
    }

    .status-msg.ok {
      background: var(--success-bg);
      color: var(--success-text);
    }

    .status-msg.err {
      background: var(--error-bg);
      color: var(--error-text);
    }

    .mural-link-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 1rem 1.2rem;
      background: var(--card);
      border: 3px solid var(--text);
      border-radius: 12px;
      color: var(--text);
      text-decoration: none;
      font-size: 1.05rem;
      font-weight: 700;
      box-shadow: 0 6px 18px rgba(36, 33, 30, 0.05);
      transition: transform 0.15s, background 0.2s;
    }

    .mural-link-btn:hover {
      background: #f4efe7;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>Escanea el QR para subir tus fotos</h1>

    <section class="qr-box">
      <div class="qr-frame">
        <img id="qrImage" src="" alt="Código QR para subir fotos" />
      </div>

      <form class="upload-area" id="uploadForm">
        <label class="pick-btn" for="photoInput">
          Subir o sacar fotos
          <span class="pick-sub">Elige una o varias desde tu galería o cámara</span>
        </label>
        <input type="file" id="photoInput" accept="image/*" multiple />

        <div class="previews" id="previews"></div>

        <button type="submit" class="btn-send" id="sendBtn">Confirmar y subir</button>
        <div class="status-msg" id="statusMsg"></div>
      </form>
    </section>

    <a href="./mural.html" class="mural-link-btn">Ver mural</a>
  </main>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbw3jH7FuKPC18MacN5XHOKWraKWz00mgfCfliuoiYi6vgU-JCFe-Voee9zdll4QGfIWzg/exec";
    const QR_TARGET_URL = window.location.href.split("#")[0];

    const qrImage = document.getElementById("qrImage");
    const uploadForm = document.getElementById("uploadForm");
    const photoInput = document.getElementById("photoInput");
    const previewsEl = document.getElementById("previews");
    const sendBtn = document.getElementById("sendBtn");
    const statusMsg = document.getElementById("statusMsg");

    qrImage.src =
      "https://api.qrserver.com/v1/create-qr-code/?size=260x260&margin=6&data=" +
      encodeURIComponent(QR_TARGET_URL);

    function showStatus(type, text) {
      statusMsg.className = "status-msg show " + type;
      statusMsg.textContent = text;
    }

    photoInput.addEventListener("change", () => {
      previewsEl.innerHTML = "";
      statusMsg.className = "status-msg";
      const files = Array.from(photoInput.files || []);
      files.forEach((file) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = document.createElement("img");
          img.src = e.target.result;
          img.alt = file.name;
          previewsEl.appendChild(img);
        };
        reader.readAsDataURL(file);
      });
    });

    function compressImage(file, maxWidth = 1600, quality = 0.82) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            let { width, height } = img;
            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }
            const canvas = document.createElement("canvas");
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, width, height);
            const dataUrl = canvas.toDataURL("image/jpeg", quality);
            resolve({
              fileName: file.name.replace(/\.[^.]+$/, "") + ".jpg",
              mimeType: "image/jpeg",
              fileData: dataUrl
            });
          };
          img.onerror = reject;
          img.src = event.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    uploadForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const files = Array.from(photoInput.files || []);
      if (files.length === 0) {
        showStatus("err", "Primero selecciona o saca al menos una foto.");
        return;
      }

      sendBtn.disabled = true;
      let uploadedCount = 0;

      for (let i = 0; i < files.length; i++) {
        showStatus("ok", `Subiendo foto ${i + 1} de ${files.length}...`);
        try {
          const compressed = await compressImage(files[i]);
          const response = await fetch(WEB_APP_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({
              fileName: compressed.fileName,
              mimeType: compressed.mimeType,
              fileData: compressed.fileData,
              guestName: "Invitado",
              message: ""
            })
          });

          const result = await response.json();
          if (result.status === "ok") {
            uploadedCount++;
          }
        } catch (err) {
          // Continúa con las demás fotos si una falla
        }
      }

      sendBtn.disabled = false;

      if (uploadedCount === files.length) {
        showStatus(
          "ok",
          uploadedCount === 1
            ? "¡Tu foto fue subida correctamente!"
            : "¡Tus fotos fueron subidas correctamente!"
        );
        photoInput.value = "";
        previewsEl.innerHTML = "";
      } else if (uploadedCount > 0) {
        showStatus("err", `Se subieron ${uploadedCount} de ${files.length} fotos. Inténtalo de nuevo con las restantes.`);
      } else {
        showStatus("err", "No se pudieron subir las fotos. Inténtalo nuevamente en unos segundos.");
      }
    });
  </script>
</body>
</html>
