<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Matrimonio Yanela y Rodrigo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f8f3eb;
      --paper: #fffdf9;
      --ink: #27221e;
      --muted: #756b60;
      --gold: #c29b52;
      --sage: #6f826a;
      --rose: #b87a6e;
      --border: #e7ddd0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      padding: 2.2rem 1.1rem 4.5rem;
      position: relative;
      overflow-x: hidden;
      background-image:
        radial-gradient(circle at 12% 8%, rgba(111, 130, 106, 0.11), transparent 36%),
        radial-gradient(circle at 88% 12%, rgba(194, 155, 82, 0.13), transparent 38%),
        radial-gradient(circle at 50% 65%, rgba(184, 122, 110, 0.07), transparent 48%);
    }

    /* Sutil textura botánica y destellos suaves de fondo */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.28;
      background-image: radial-gradient(rgba(194, 155, 82, 0.35) 1px, transparent 1px);
      background-size: 28px 28px;
      z-index: 0;
    }

    header {
      position: relative;
      z-index: 1;
      max-width: 920px;
      margin: 0 auto 2.6rem;
      text-align: center;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.78rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--sage);
      font-weight: 600;
      margin-bottom: 0.55rem;
    }

    .eyebrow::before,
    .eyebrow::after {
      content: "";
      width: 24px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }

    header h1 {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(2.3rem, 5.5vw, 3.8rem);
      font-weight: 700;
      line-height: 1.05;
      letter-spacing: -0.01em;
      color: var(--ink);
    }

    header h1 em {
      font-style: italic;
      color: var(--gold);
      font-weight: 500;
      padding: 0 0.12em;
    }

    .header-flourish {
      margin: 0.85rem auto 0;
      width: 120px;
      height: 10px;
      border-bottom: 1px solid rgba(194, 155, 82, 0.55);
      position: relative;
    }

    .header-flourish::after {
      content: "✦";
      position: absolute;
      left: 50%;
      top: 1px;
      transform: translateX(-50%);
      font-size: 0.75rem;
      color: var(--gold);
      background: var(--bg);
      padding: 0 0.45rem;
    }

    .collage-stage {
      position: relative;
      z-index: 1;
      max-width: 1380px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1.35rem 1rem;
      align-items: center;
    }

    @media (min-width: 640px) {
      .collage-stage {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 1.8rem 1.4rem;
      }
    }

    @media (min-width: 1024px) {
      .collage-stage {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 2.1rem 1.7rem;
      }
    }

    .collage-piece {
      position: relative;
      background: var(--paper);
      padding: 0.55rem 0.55rem 0.85rem;
      border-radius: 12px;
      border: 1px solid var(--border);
      box-shadow:
        0 12px 26px rgba(39, 34, 30, 0.08),
        0 2px 6px rgba(194, 155, 82, 0.10);
      cursor: pointer;
      transform: rotate(var(--tilt, 0deg)) translateY(var(--shift-y, 0px));
      transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.25s ease, border-color 0.25s ease;
      z-index: 1;
    }

    .collage-piece::after {
      content: "";
      position: absolute;
      inset: 4px;
      border-radius: 9px;
      border: 1px solid rgba(194, 155, 82, 0.22);
      pointer-events: none;
    }

    .collage-piece:hover {
      transform: rotate(0deg) translateY(-5px) scale(1.02);
      border-color: rgba(194, 155, 82, 0.55);
      box-shadow:
        0 20px 38px rgba(39, 34, 30, 0.14),
        0 0 0 3px rgba(194, 155, 82, 0.12);
      z-index: 10;
    }

    .collage-piece.featured {
      grid-column: span 2;
      padding: 0.7rem 0.7rem 1rem;
    }

    .collage-piece img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 7px;
      background: #eee7dc;
    }

    .collage-piece.featured img {
      max-height: 450px;
      object-fit: cover;
    }

    .empty-state {
      position: relative;
      z-index: 1;
      max-width: 500px;
      margin: 2.5rem auto;
      text-align: center;
      color: var(--muted);
      padding: 2.4rem 1.4rem;
      background: var(--paper);
      border: 1px solid var(--border);
      border-radius: 16px;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 1.35rem;
      font-style: italic;
    }

    /* Visor a tamaño real al hacer clic */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(20, 17, 14, 0.9);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1.2rem;
      z-index: 1000;
    }

    .lightbox.open {
      display: flex;
    }

    .lightbox-inner {
      position: relative;
      max-width: 95vw;
      max-height: 92vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .lightbox-inner img {
      display: block;
      width: auto;
      height: auto;
      max-width: 92vw;
      max-height: 88vh;
      border-radius: 10px;
      border: 2px solid rgba(194, 155, 82, 0.45);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
      background: #1c1815;
    }

    .lightbox-close {
      position: fixed;
      top: 1rem;
      right: 1rem;
      width: 44px;
      height: 44px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.14);
      color: #fff;
      font-size: 1.6rem;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .lightbox-close:hover {
      background: rgba(255, 255, 255, 0.26);
    }
  </style>
</head>
<body>
  <header>
    <div class="eyebrow">Celebración</div>
    <h1>Matrimonio Yanella <em>&amp;</em> Rodrigo</h1>
    <div class="header-flourish" aria-hidden="true"></div>
  </header>

  <main>
    <div class="collage-stage" id="collageStage"></div>
    <div class="empty-state" id="emptyState" style="display: none;">
      Aún no hay fotos en el mural.
    </div>
  </main>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Vista completa de la foto">
    <button class="lightbox-close" id="lightboxClose" aria-label="Cerrar">&times;</button>
    <div class="lightbox-inner" id="lightboxInner">
      <img id="lightboxImg" src="" alt="Foto original" />
    </div>
  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbw3jH7FuKPC18MacN5XHOKWraKWz00mgfCfliuoiYi6vgU-JCFe-Voee9zdll4QGfIWzg/exec";
    const POLL_INTERVAL_MS = 10000;

    const collageStage = document.getElementById("collageStage");
    const emptyState = document.getElementById("emptyState");
    const lightbox = document.getElementById("lightbox");
    const lightboxInner = document.getElementById("lightboxInner");
    const lightboxImg = document.getElementById("lightboxImg");
    const lightboxClose = document.getElementById("lightboxClose");

    const COLLAGE_PRESETS = [
      { tilt: "-2.2deg", shiftY: "0px", featured: true },
      { tilt: "2.8deg", shiftY: "7px", featured: false },
      { tilt: "-3deg", shiftY: "-5px", featured: false },
      { tilt: "1.8deg", shiftY: "6px", featured: false },
      { tilt: "-1.8deg", shiftY: "-4px", featured: false },
      { tilt: "3deg", shiftY: "8px", featured: false },
      { tilt: "1.5deg", shiftY: "-5px", featured: true },
      { tilt: "-2.6deg", shiftY: "6px", featured: false }
    ];

    function openLightbox(photo) {
      lightboxImg.src = photo.fullUrl || photo.url || "";
      lightbox.classList.add("open");
    }

    function closeLightbox() {
      lightbox.classList.remove("open");
      lightboxImg.src = "";
    }

    function renderPhotos(photos) {
      const sorted = Array.isArray(photos)
        ? [...photos].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0))
        : [];

      if (sorted.length === 0) {
        collageStage.innerHTML = "";
        emptyState.style.display = "block";
        return;
      }

      emptyState.style.display = "none";
      collageStage.innerHTML = "";

      sorted.forEach((photo, index) => {
        const preset = COLLAGE_PRESETS[index % COLLAGE_PRESETS.length];
        const article = document.createElement("article");
        article.className = "collage-piece" + (preset.featured ? " featured" : "");
        article.dataset.id = photo.id || "";
        article.style.setProperty("--tilt", preset.tilt);
        article.style.setProperty("--shift-y", preset.shiftY);

        const img = document.createElement("img");
        img.src = photo.url || "";
        img.alt = "Foto del matrimonio";
        img.loading = "lazy";

        article.appendChild(img);
        article.addEventListener("click", () => openLightbox(photo));
        collageStage.appendChild(article);
      });
    }

    async function syncMural() {
      try {
        const res = await fetch(WEB_APP_URL, { method: "GET" });
        const data = await res.json();
        if (data.status === "ok") {
          renderPhotos(data.photos || []);
        }
      } catch (err) {
        // Conserva las fotos ya mostradas si hay un corte momentáneo
      }
    }

    lightboxClose.addEventListener("click", closeLightbox);
    lightbox.addEventListener("click", (e) => {
      if (e.target === lightbox || e.target === lightboxInner) {
        closeLightbox();
      }
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && lightbox.classList.contains("open")) {
        closeLightbox();
      }
    });

    syncMural();
    setInterval(syncMural, POLL_INTERVAL_MS);
  </script>
</body>
</html>
