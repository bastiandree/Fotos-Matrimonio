<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Matrimonio Yanela y Rodrigo</title>
  <style>
    :root {
      --bg: #faf7f2;
      --card: #ffffff;
      --text: #24211e;
      --muted: #6e665f;
      --border: #e6dfd5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 1.5rem 1rem 3.5rem;
    }

    header {
      max-width: 1400px;
      margin: 0 auto 1.5rem;
      text-align: center;
    }

    header h1 {
      font-size: clamp(1.8rem, 4.5vw, 2.8rem);
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .collage {
      max-width: 1400px;
      margin: 0 auto;
      column-count: 2;
      column-gap: 0.85rem;
    }

    @media (min-width: 640px) {
      .collage {
        column-count: 3;
        column-gap: 1rem;
      }
    }

    @media (min-width: 1024px) {
      .collage {
        column-count: 4;
        column-gap: 1.1rem;
      }
    }

    .photo-tile {
      break-inside: avoid;
      margin-bottom: 1rem;
      border-radius: 14px;
      overflow: hidden;
      background: var(--card);
      border: 1px solid var(--border);
      box-shadow: 0 4px 14px rgba(36, 33, 30, 0.05);
    }

    .photo-tile img {
      display: block;
      width: 100%;
      height: auto;
      background: #efeae2;
    }

    .empty-state {
      max-width: 520px;
      margin: 2rem auto;
      text-align: center;
      color: var(--muted);
      padding: 2.2rem 1.2rem;
      background: var(--card);
      border: 1px dashed var(--border);
      border-radius: 16px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Matrimonio Yanela y Rodrigo</h1>
  </header>

  <main>
    <div class="collage" id="collage"></div>
    <div class="empty-state" id="emptyState" style="display: none;">
      Aún no hay fotos en el mural.
    </div>
  </main>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbw3jH7FuKPC18MacN5XHOKWraKWz00mgfCfliuoiYi6vgU-JCFe-Voee9zdll4QGfIWzg/exec";
    const POLL_INTERVAL_MS = 10000;

    const collage = document.getElementById("collage");
    const emptyState = document.getElementById("emptyState");

    function renderPhotos(photos) {
      const sorted = Array.isArray(photos)
        ? [...photos].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0))
        : [];

      if (sorted.length === 0) {
        collage.innerHTML = "";
        emptyState.style.display = "block";
        return;
      }

      emptyState.style.display = "none";
      collage.innerHTML = sorted
        .map((photo) => {
          const safeUrl = String(photo.url || "").replace(/"/g, "&quot;");
          return `
            <article class="photo-tile" data-id="${photo.id || ""}">
              <img src="${safeUrl}" alt="Foto del matrimonio" loading="lazy" />
            </article>
          `;
        })
        .join("");
    }

    async function syncMural() {
      try {
        const res = await fetch(WEB_APP_URL, { method: "GET" });
        const data = await res.json();
        if (data.status === "ok") {
          renderPhotos(data.photos || []);
        }
      } catch (err) {
        // Mantiene la vista actual si hay un parpadeo de red
      }
    }

    syncMural();
    setInterval(syncMural, POLL_INTERVAL_MS);
  </script>
</body>
</html>
